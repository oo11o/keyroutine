<!-- Source of truth for the extension icons. The PNGs beside it are generated
     from this file, not drawn separately: Chrome will not take an SVG in the
     manifest's icons map, which is the only reason they exist.

     To regenerate after editing this file (no rasteriser needed — Chrome is
     already on the machine, and the extension targets it anyway):

       for n in 16 32 48 128; do
         printf '<html><style>html,body{margin:0}svg{display:block;width:%dpx;height:%dpx}</style>%s' \
           "$n" "$n" "$(sed '1,14d' public/icons/icon.svg)" > /tmp/i.html
         "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
           --force-device-scale-factor=1 --default-background-color=00000000 \
           --window-size=$n,$n --screenshot="public/icons/icon$n.png" file:///tmp/i.html
       done -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="KeyRoutine icon: a K whose own outline loops back into a repeat arrow">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#g)"/>
  <path d="M102 52V84A18 18 0 0 1 84 102H44A18 18 0 0 1 26 84V44A18 18 0 0 1 44 26H68" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M81 26L68 17V35Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 46V82M54 68L76 46M61 62L78 82" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
